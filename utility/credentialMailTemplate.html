<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Template</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
      }
      .email-container {
        max-width: 600px;
        margin: 20px auto;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .header {
        text-align: center;
        padding: 10px 0;
      }
      .header h3 {
        font-size: 36px;
        color: red;
        font-style: oblique;
        margin: 0;
      }
      .sub-header {
        text-align: center;
        margin-top: 5px;
        font-style: italic;
        font-size: 14px;
        color: #555555;
      }
      .icon {
        text-align: center;
        color: blueviolet;
        margin: 20px 0;
      }
      .main-content {
        text-align: center;
      }
      .main-content h3 {
        font-size: 24px;
        margin: 0;
      }
      .main-content p {
        font-size: 16px;
        margin: 10px 0;
      }
      .credentials {
        font-size: 16px;
        margin-top: 20px;
      }
      .credentials p {
        margin: 5px 0;
      }
      .footer {
        text-align: center;
        margin-top: 20px;
        font-size: 12px;
        color: #777777;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <div class="header">
        <h3><b>NISH APARTMENTS</b></h3>
      </div>
      <div class="sub-header">
        A framework tool to measure, monitor, analyze, and actionize
      </div>
      <div class="icon">
        <span class="material-icons">email</span>
      </div>
      <div class="main-content">
        <h3><b>Congrats, you are invited</b></h3>
        <p>Here are your login credentials:</p>
        <div class="credentials">
          <p><b>Email:</b> {email}</p>
          <p><b>Password:</b> {password}</p>
        </div>
      </div>
      <div class="footer">
        <p>If you did not request this, please ignore this email.</p>
      </div>
    </div>
  </body>
</html>
